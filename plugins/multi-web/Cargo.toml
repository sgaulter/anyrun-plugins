[package]
name = "multi-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Configurable web searches with independent engine prefixes for anyrun"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11.3"
anyrun-plugin = { git = "https://github.com/anyrun-org/anyrun", branch = "master" }
ron = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
